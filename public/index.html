<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생기부 작성 도우미</title>
<meta name="description" content="중학교 기재요령에 맞는 교사 관찰 문장(~함, ~했음)을 쓰고 바로 점검합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23247A5B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z'/%3E%3Cpath d='M14 2v4a2 2 0 0 0 2 2h4'/%3E%3Cpath d='M8 13h8'/%3E%3Cpath d='M8 17h5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-in">
      <div class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h8"/><path d="M8 17h5"/></svg></div>
      <div>
        <h1>생기부 작성 도우미</h1>
        <p>중학교 기재요령에 맞는 교사 관찰 문장(~함, ~했음)을 쓰고 바로 점검합니다.</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="tabs" role="tablist" aria-label="작성 영역">
      <button type="button" class="tab" role="tab" id="tab-gwa" data-top="gwa">교과 세부능력 및 특기사항 (과세특)<span>모든 교과 선생님</span></button>
      <button type="button" class="tab" role="tab" id="tab-home" data-top="home">자율·자치활동 · 행동특성 및 종합의견<span>담임 선생님</span></button>
    </div>

    <div class="main">
      <section class="card left" id="left" aria-label="입력"></section>
      <section class="card right" id="right" aria-label="결과"></section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
